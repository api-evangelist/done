summary_text: '_done has no conventional authentication. There are no accounts, no signup, no API keys and no OAuth.
  Authorisation IS payment: an unpaid POST to any of the 27 operations returns HTTP 402 with an x402 challenge,
  and the caller re-sends the identical request carrying a signed USDC transfer authorization in an X-PAYMENT header.
  The only securityScheme declared in the specs, `siwx`, is an OPTIONAL session-continuation mechanism layered on
  top of that, and it is undocumented beyond its one-line description.'
