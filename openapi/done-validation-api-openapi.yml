openapi: 3.2.0
info:
  title: BIMI Checker Validation API
  description: Checks one or more website addresses to see if they are properly set up to show a brand logo next to emails in inboxes like Gmail, Apple Mail, and Yahoo. It looks up the special settings the domain has published, checks that the logo picture follows the required format, checks that a security certificate for the logo (if any) is valid and not expired, and confirms the domain has strict enough email protection rules turned on. It returns a clear pass or fail for each domain along with a plain list of what is broken if something fails.
  version: 1.0.0
  contact:
    name: _done
    url: https://forms.gle/5KzuSFH7p8hHtDmz7
    email: info@underscoredone.com
  x-openapi-url: https://bimi-checker.underscoredone.com/openapi.json
  x-logo:
    url: https://underscoredone.com/logo.png
    altText: _done
  x-guidance: Call this when a user asks whether a domain's email logo (BIMI) setup will work, why a brand logo is not showing in inboxes, or to audit email branding for one or more domains. Submit domains without http/https prefixes. Limit to 10 domains per call. Set check_vmc to false for a faster, cheaper check when certificate validation is not needed. Read the issues list per domain to explain failures in plain terms.
  x-ai-instructions: Call this when a user asks whether a domain's email logo (BIMI) setup will work, why a brand logo is not showing in inboxes, or to audit email branding for one or more domains. Submit domains without http/https prefixes. Limit to 10 domains per call. Set check_vmc to false for a faster, cheaper check when certificate validation is not needed. Read the issues list per domain to explain failures in plain terms.
  x-provider: _done — single-purpose utility APIs for developers and AI agents. Pay per call with USDC on Base Mainnet or Solana Mainnet.
  x-pricing:
    model: pay-per-call
    currency: USDC
    network: Base Mainnet or Solana Mainnet
    price: $0.01
  x-keywords:
  - bimi
  - bimi checker
  - email branding
  - dmarc
  - vmc certificate
  - email authentication
  - brand indicators for message identification
  - logo validation
  - email deliverability
  - svg validation
  - inbox logo
  - domain email setup
  - utility
  - api
  - ai-agent
