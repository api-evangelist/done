paths:
  /check:
    post:
      tags:
      - Validation
      summary: Checks if a domain's email logo branding setup is valid and ready to display.
      description: Checks one or more website addresses to see if their email branding logo setup will work correctly, and explains what is wrong if it will not.
      operationId: handler_check_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Request'
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                success:
                  summary: Successful response
                  value:
                    api_version: 1.0.0
        '422':
          description: Unprocessable — a required field is missing or the wrong type. Check the detail field for specifics.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: array
        '402':
          description: Payment required. Send a signed USDC payment on Base Mainnet or Solana Mainnet using the x402 protocol.
          headers:
            X-Payment-Response:
              description: x402 payment challenge — base64-encoded JSON with payment details.
              schema:
                type: string
        '400':
          description: Bad request — your input failed validation or could not be processed. Check the detail field for specifics.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
      x-ai-instructions: Call this when a user asks whether a domain's email logo (BIMI) setup will work, why a brand logo is not showing in inboxes, or to audit email branding for one or more domains. Submit domains without http/https prefixes. Limit to 10 domains per call. Set check_vmc to false for a faster, cheaper check when certificate validation is not needed. Read the issues list per domain to explain failures in plain terms.
      x-guidance: Call this when a user asks whether a domain's email logo (BIMI) setup will work, why a brand logo is not showing in inboxes, or to audit email branding for one or more domains. Submit domains without http/https prefixes. Limit to 10 domains per call. Set check_vmc to false for a faster, cheaper check when certificate validation is not needed. Read the issues list per domain to explain failures in plain terms.
      x-payment-info:
        price:
          fixed:
            mode: fixed
            currency: USD
            amount: '0.01'
        protocols:
        - x402: {}
components:
  schemas:
    Request:
      properties:
        domains:
          items:
            type: string
          type: array
          title: Domains
          description: List of website addresses to check, such as example.com. Up to 10 per request. Do not include http:// or https://.
        selector:
          type: string
          title: Selector
          description: The label used to find the branding settings, almost always 'default'. Only change this if the domain uses a custom label.
          default: default
        check_vmc:
          type: boolean
          title: Check Vmc
          description: Whether to also verify the logo's security certificate. Turn off for a quicker check.
          default: true
      type: object
      required:
      - domains
      title: Request
      example:
        check_vmc: true
        domains:
        - example.com
        - brand.co
        selector: default
    DomainResult:
      properties:
        domain:
          type: string
          title: Domain
          description: The website address that was checked.
        selector:
          type: string
          title: Selector
          description: The label used to find the branding settings for this website.
        valid:
          type: boolean
          title: Valid
          description: Whether the branding setup is fully correct and ready to display a logo.
        issues:
          items:
            type: string
          type: array
          title: Issues
          description: A plain list of everything that is broken, if anything.
        checks:
          $ref: '#/components/schemas/DomainCheckDetail'
          description: The individual results for each part of the check.
      type: object
      required:
      - domain
      - selector
      - valid
      - issues
      - checks
      title: DomainResult
      example:
        checks:
          bimi_record_found: false
          dmarc_strict: false
        domain: example.com
        issues:
        - No BIMI TXT record found at default._bimi.example.com
        selector: default
        valid: false
    Response:
      properties:
        api_version:
          type: string
          title: Api Version
          description: The version of this checking service.
          default: 1.0.0
        checked:
          type: integer
          title: Checked
          description: How many website addresses were checked.
        results:
          items:
            $ref: '#/components/schemas/DomainResult'
          type: array
          title: Results
          description: The check results for each website address, in the order submitted.
      type: object
      required:
      - checked
      - results
      title: Response
      example:
        api_version: 1.0.0
        checked: 1
        results:
        - checks:
            bimi_record_found: false
            dmarc_strict: false
          domain: example.com
          issues:
          - No BIMI TXT record found at default._bimi.example.com
          selector: default
          valid: false
    DomainCheckDetail:
      properties:
        bimi_record_found:
          type: boolean
          title: Bimi Record Found
          description: Whether the special branding settings were found for this website.
        svg_valid:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Svg Valid
          description: Whether the logo picture follows the required format. Empty if it was not checked.
        vmc_valid:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Vmc Valid
          description: Whether the logo's security certificate is valid and not expired. Empty if it was not checked.
        dmarc_strict:
          type: boolean
          title: Dmarc Strict
          description: Whether the domain has strict enough email protection rules turned on.
      type: object
      required:
      - bimi_record_found
      - dmarc_strict
      title: DomainCheckDetail
      example:
        bimi_record_found: false
        dmarc_strict: false
  securitySchemes:
    siwx:
      type: apiKey
      in: header
      name: SIGN-IN-WITH-X
      description: CAIP-122 wallet signature for repeat access after payment
