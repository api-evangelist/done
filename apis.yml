- name: CORS Header Checker
  description: 'Send a URL and origin, get back exactly which cross-origin permissions that server grants. Sends
    a real request to any URL you provide, attaches an Origin header, and reads back all six standard cross-origin
    permission headers the server returns. Tells you whether cross-origin requests are enabled at all, whether your
    specific origin is permitted, and shows you every permission value exactly as the server sent it. Perfect for
    figuring out why a browser is blocking a request, confirming a freshly deployed service is configured correctly,
    or auditing whether a public API allows credentialed cross-origin calls. Pay-per-call at $0.01 USDC over x402
    on Base or Solana — no account, no API key. OpenAPI 3.1.0; 1 operation(s): POST /check.'
