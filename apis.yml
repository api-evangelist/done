name: _done
description: '_done is an agent-native catalog of 26 single-purpose utility REST APIs — network and DNS lookups,
  domain intelligence, email-authentication checks, HTTP and SEO inspection, OCR, screenshots, hashing, JSON tooling,
  web3 resolution and finance calculators. There are no accounts, no signups and no API keys: every call is metered
  individually at $0.01 in USDC over the x402 protocol, settled on Base Mainnet or Solana Mainnet through the Coinbase
  CDP facilitator. Each service runs on its own subdomain, exposes a single POST operation, and publishes its own
  OpenAPI 3.1.0 spec annotated for AI agents with x-ai-instructions, x-guidance, x-pricing and x-402 payment metadata.
  Discovery is served from /.well-known/x402.json, /llms.txt, robots.txt and sitemap.xml. There is no MCP server,
  no A2A agent card, no SDK, no changelog, no status page and no published terms of service.'
