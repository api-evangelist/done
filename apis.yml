- name: Domain Availability Checker
  description: 'Check whether 1–10 domain names have an active registration record using the official RDAP protocol.
    Give this API up to 10 domain names and it will tell you whether each one has a registration record on file
    with the official registry. It uses RDAP — the modern, structured replacement for WHOIS — so there is no messy
    free-text parsing. Each domain comes back labeled ''registered'', ''unregistered'', or ''indeterminate'' (when
    the registry does not support RDAP for that ending). Important: ''unregistered'' means no record was found,
    which usually means the name is available — but reserved or premium names can also return no record. This API
    tells you registration status only; it does not tell you price, premium status, or whether a registrar will
    actually let you buy the name. Pay-per-call at $0.01 USDC over x402 on Base or Solana — no account, no API key.
    OpenAPI 3.1.0; 1 operation(s): POST /check.'
